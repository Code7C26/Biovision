<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <!-- resizes-content: con el teclado abierto (Chrome en Android) la página se achica y Compose
         reacomoda el diálogo arriba del teclado; si no, el teclado tapaba el botón "Guardar" -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!--
        Política de seguridad (CSP): solo scripts propios (sin scripts en línea ni eval; 'wasm-unsafe-eval'
        es lo que permite compilar el .wasm), datos solo de las APIs públicas que usa la app y, como
        página incrustada, solo el mapa propio y el de Windy. Si se agrega un servicio, sumarlo acá.
        frame-ancestors no funciona en <meta>: va como cabecera en vercel.json / firebase.json.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://dolarapi.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://granosar.lfcaucino.workers.dev https://api.argentinadatos.com https://nominatim.openstreetmap.org __ORIGEN_SUPABASE__; frame-src 'self' https://embed.windy.com; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>GRANEX</title>
    <meta name="description" content="GRANEX: dólar, clima agro, mapa satelital, pizarra de Rosario y margen agrícola.">
    <meta name="color-scheme" content="light dark">
    <!-- Vista previa al compartir el enlace; las líneas con la URL pública se quitan si no se configuró GRANEX_URL_PUBLICA -->
    <link rel="canonical" href="__URL_PUBLICA__">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GRANEX">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="GRANEX · Agro, mercados y clima">
    <meta property="og:description" content="Dólar, clima agro con mapa de Windy, lotes con imágenes satelitales, pizarra de Rosario y margen agrícola.">
    <meta property="og:url" content="__URL_PUBLICA__">
    <meta property="og:image" content="__URL_PUBLICA__icons/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F2920" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GRANEX">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Antes de pintar: aplica el tema guardado (la pantalla de carga no "parpadea") y registra el service worker -->
    <script src="inicio.js"></script>
    <style>
        :root { --fondo: #F7F9F2; --texto: #0F172A; --suave: #64748B; --marca: #047857; --pista: rgba(4,120,87,.18);
                --aviso-fondo: #0F172A; --aviso-texto: #F9FAFB; --aviso-boton: #6EE7B7; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-tema="claro"]) { --fondo: #061A14; --texto: #F9FAFB; --suave: #9CA3AF; --marca: #34D399;
                --pista: rgba(52,211,153,.18); --aviso-fondo: #F9FAFB; --aviso-texto: #0F172A; --aviso-boton: #047857; }
        }
        :root[data-tema="oscuro"] { --fondo: #061A14; --texto: #F9FAFB; --suave: #9CA3AF; --marca: #34D399;
            --pista: rgba(52,211,153,.18); --aviso-fondo: #F9FAFB; --aviso-texto: #0F172A; --aviso-boton: #047857; }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto); }
        #granex { position: fixed; inset: 0; }
        #cargando {
            position: fixed; inset: 0; z-index: 10; background: var(--fondo);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s ease;
        }
        #cargando img { width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
        #cargando .nombre { font-weight: 800; letter-spacing: .12em; color: var(--marca); }
        #cargando .lema { font-size: 13px; color: var(--suave); margin-top: -12px; }
        #cargando .barra { width: 160px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--pista); }
        #cargando .barra::after { content: ""; display: block; width: 40%; height: 100%; background: var(--marca); animation: avance 1.1s ease-in-out infinite; }
        #cargando.oculto { opacity: 0; pointer-events: none; }
        #carga-demorada { max-width: 340px; padding: 0 16px; text-align: center; color: var(--suave); font-weight: 400; font-size: 14px; }
        #carga-demorada button { margin-top: 4px; border: 1px solid var(--marca); border-radius: 10px; background: transparent;
            color: var(--marca); padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
        @keyframes avance { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #cargando .barra::after { animation: none; width: 100%; } #cargando { transition: none; } }

        /* Aviso de versión nueva (lo crea inicio.js). Sobre la barra inferior en el teléfono. */
        #aviso-version {
            position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
            bottom: calc(96px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
            display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 12px;
            background: var(--aviso-fondo); color: var(--aviso-texto); box-shadow: 0 8px 24px rgba(0,0,0,.25);
            font: 500 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        @media (min-width: 600px) { #aviso-version { bottom: 24px; } }
        #aviso-version span { flex: 1; }
        #aviso-version button {
            border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; background: transparent;
            color: var(--aviso-boton); font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
        }
        #aviso-version button:hover, #aviso-version button:focus-visible { background: rgba(127,127,127,.18); outline: none; }
        noscript { position: fixed; inset: auto 0 0 0; z-index: 30; padding: 16px; text-align: center;
                   font: 15px/1.4 system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
    </style>
</head>
<body>
    <div id="cargando" role="status" aria-live="polite">
        <img src="icons/icon-192.png" alt="">
        <div class="nombre">GRANEX</div>
        <div class="lema">Agro · Mercados · Clima</div>
        <div class="barra"></div>
        <!-- Lo muestra inicio.js si la app tarda demasiado o no puede cargar -->
        <div id="carga-demorada" hidden>
            <p id="carga-demorada-texto">La carga está tardando más de lo normal. Con una conexión lenta la primera vez puede demorar; si no, recargá la página.</p>
            <button type="button" id="carga-recargar">Recargar</button>
        </div>
    </div>
    <div id="granex"></div>
    <noscript>GRANEX necesita JavaScript habilitado.</noscript>
    <script src="webApp.js"></script>
</body>
</html>
