# Compila la PWA (Compose Multiplatform, Wasm + JS) y la publica en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions". Ver docs/web/DESPLIEGUE.md.
name: Web PWA

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "webApp/**"
      - "app/src/main/assets/mapa/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/web-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Los tests comunes corren en la JVM y en Node (Wasm/JS) antes de publicar.
      # Datos de publicación: Settings → Secrets and variables → Actions → Variables (no son secretos:
      # la clave de Supabase es la PÚBLICA; el build se corta si alguien carga la secreta).
      - run: ./gradlew :shared:allTests :webApp:distribucionPwa --console=plain
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GRANEX_URL_PUBLICA: ${{ vars.GRANEX_URL_PUBLICA }}
          GRANEX_EMAIL_SOPORTE: ${{ vars.GRANEX_EMAIL_SOPORTE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
